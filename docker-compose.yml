# Local development Postgres only. Bound to 127.0.0.1 so it is never exposed on
# the network. The credentials are throwaway local-dev values, not secrets.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_test
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_test"]
      interval: 2s
      timeout: 3s
      retries: 15
